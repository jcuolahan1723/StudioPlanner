<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio Planner">
<meta name="theme-color" content="#0f0f0f">
<title>Studio Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fafaf7;
  --bg2: #ffffff;
  --bg3: #f4f3ee;
  --bg4: #eceae3;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.16);
  --text: #1a1a18;
  --text2: #5a5a55;
  --text3: #aaa89e;
  --burn: #c8380a;
  --burn-dim: rgba(200,56,10,0.08);
  --strength: #b07d00;
  --strength-dim: rgba(176,125,0,0.08);
  --boxing: #1a5fbf;
  --boxing-dim: rgba(26,95,191,0.08);
  --yellow: #f5c800;
  --yellow-mid: #e6b800;
  --yellow-dim: rgba(245,200,0,0.15);
  --yellow-deep: #7a6100;
  --accent: #f5c800;
  --green: #1a7a45;
  --green-dim: rgba(26,122,69,0.1);
  --radius: 14px;
  --radius-sm: 9px;
  --sans: "DM Sans", sans-serif;
  --serif: "DM Serif Display", serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.5; overflow: hidden; }

#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
#header { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; }
#header-top { display: flex; align-items: center; justify-content: space-between; }
.app-title { font-family: var(--serif); font-size: 22px; color: var(--text); letter-spacing: -0.3px; }
.app-subtitle { font-size: 11px; color: var(--text3); margin-top: 1px; letter-spacing: 0.5px; text-transform: uppercase; }
#content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); }
#nav { display: flex; border-top: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px 14px; border: none; background: none; color: var(--text3); font-family: var(--sans); font-size: 10px; letter-spacing: 0.4px; text-transform: uppercase; cursor: pointer; transition: color .2s; }
.nav-btn.active { color: var(--text); }
.nav-btn.active .nav-icon { stroke: var(--text); }
.nav-active-bar { display: none; }
.nav-btn.active .nav-active-bar { display: block; width: 20px; height: 2px; background: var(--yellow); border-radius: 2px; margin: 1px auto 0; }
.nav-icon { width: 22px; height: 22px; stroke: var(--text3); transition: stroke .2s; }

.panel { display: none; padding: 20px; }
.panel.active { display: block; }

.sec-label { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 12px; }

.class-tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 20px; }
.class-tab { padding: 10px 6px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg2); font-family: var(--sans); font-size: 11px; font-weight: 500; color: var(--text2); cursor: pointer; text-align: center; transition: all .2s; }
.class-tab.active-burn { border-color: var(--burn); background: var(--burn-dim); color: var(--burn); }
.class-tab.active-strength { border-color: var(--strength); background: var(--strength-dim); color: var(--strength); }
.class-tab.active-boxing { border-color: var(--boxing); background: var(--boxing-dim); color: var(--boxing); }

.seq-block { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; }
.seq-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; user-select: none; }
.seq-head:active { background: var(--bg3); }
.seq-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.seq-name { font-size: 14px; font-weight: 500; flex: 1; color: var(--text); }
.seq-count { font-size: 11px; color: var(--text3); }
.seq-chevron { width: 16px; height: 16px; color: var(--text3); transition: transform .2s; flex-shrink: 0; }
.seq-chevron.open { transform: rotate(90deg); }
.seq-pips { display: flex; gap: 3px; margin-top: 4px; }
.seq-pip { height: 2px; border-radius: 2px; flex: 1; background: var(--bg4); transition: background .2s; }
.seq-body { display: none; border-top: 1px solid var(--border); }
.seq-body.open { display: block; }
.move-row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg2); }
.move-row:last-child { border-bottom: none; }
.move-info { flex: 1; min-width: 0; }
.move-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.move-muscle { font-size: 11px; color: var(--text3); margin-top: 1px; }
.move-dur { font-size: 11px; color: var(--text3); flex-shrink: 0; }
.add-move-btn { padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border2); background: none; font-family: var(--sans); font-size: 11px; font-weight: 500; color: var(--text2); cursor: pointer; transition: all .15s; flex-shrink: 0; white-space: nowrap; }
.add-move-btn:active { transform: scale(0.96); }
.add-move-btn.added { background: var(--yellow-dim); border-color: var(--yellow-mid); color: var(--yellow-deep); font-weight: 600; }

.stats-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
.stat-card { background: var(--yellow); border-radius: var(--radius-sm); padding: 14px 10px; text-align: center; }
.stat-val { font-family: var(--serif); font-size: 28px; color: var(--text); line-height: 1; }
.stat-lbl { font-size: 10px; color: var(--yellow-deep); margin-top: 4px; letter-spacing: 0.5px; text-transform: uppercase; font-weight: 600; }

.coverage-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.cov-pill { font-size: 10px; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); color: var(--text3); background: var(--bg2); transition: all .2s; font-weight: 500; }
.cov-pill.covered { background: var(--bg2); border-color: var(--border2); color: var(--text); }

.session-name-input { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; font-family: var(--sans); font-size: 14px; color: var(--text); margin-bottom: 16px; }
.session-name-input::placeholder { color: var(--text3); }
.session-name-input:focus { outline: none; border-color: var(--yellow-mid); box-shadow: 0 0 0 3px var(--yellow-dim); }

.session-group { margin-bottom: 14px; }
.session-group-label { font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.session-group-dot { width: 6px; height: 6px; border-radius: 50%; }
.session-slot { display: flex; align-items: center; gap: 10px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 4px; }
.slot-name { flex: 1; font-size: 13px; font-weight: 500; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.slot-dur { font-size: 11px; color: var(--text3); flex-shrink: 0; }
.slot-rm { width: 22px; height: 22px; border-radius: 50%; background: var(--bg3); border: none; color: var(--text3); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .15s; line-height: 1; padding: 0; font-family: var(--sans); }
.slot-rm:active { background: var(--burn-dim); color: var(--burn); }

.tip-card { background: var(--bg2); border: 1px solid var(--border); border-left: 3px solid; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 10px 12px; margin-bottom: 8px; }
.tip-card.tip-ok { border-left-color: var(--green); }
.tip-card.tip-warn { border-left-color: var(--strength); }
.tip-card.tip-info { border-left-color: var(--boxing); }
.tip-label { font-size: 9px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 3px; }
.tip-card.tip-ok .tip-label { color: var(--green); }
.tip-card.tip-warn .tip-label { color: var(--strength); }
.tip-card.tip-info .tip-label { color: var(--boxing); }
.tip-text { font-size: 12px; color: var(--text2); line-height: 1.5; }

.empty-state { text-align: center; padding: 48px 20px; color: var(--text3); }
.empty-icon { width: 40px; height: 40px; margin: 0 auto 12px; opacity: 0.25; }
.empty-text { font-size: 14px; color: var(--text2); }
.empty-sub { font-size: 12px; margin-top: 4px; }

.action-row { display: flex; gap: 8px; margin-top: 20px; padding-bottom: 20px; }
.btn-primary { flex: 1; background: var(--yellow); color: var(--text); border: none; border-radius: var(--radius-sm); padding: 14px; font-family: var(--sans); font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; }
.btn-primary:active { background: var(--yellow-mid); }
.btn-secondary { background: var(--bg2); color: var(--text2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 18px; font-family: var(--sans); font-size: 14px; cursor: pointer; transition: all .15s; }
.btn-secondary:active { border-color: var(--border2); color: var(--text); background: var(--bg3); }

.add-move-form { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; }
.form-title { font-size: 13px; font-weight: 600; margin-bottom: 14px; color: var(--text); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.form-row.full { grid-template-columns: 1fr; }
.form-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font-family: var(--sans); font-size: 13px; color: var(--text); }
.form-input::placeholder { color: var(--text3); }
.form-input:focus { outline: none; border-color: var(--yellow-mid); box-shadow: 0 0 0 3px var(--yellow-dim); }
.form-select { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font-family: var(--sans); font-size: 13px; color: var(--text); appearance: none; }
.form-select:focus { outline: none; border-color: var(--yellow-mid); }
.form-btn { width: 100%; background: var(--yellow); border: none; border-radius: var(--radius-sm); padding: 12px; font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; margin-top: 4px; transition: all .15s; }
.form-btn:active { background: var(--yellow-mid); }

.cat-item { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px; }
.cat-title { font-size: 15px; font-weight: 500; margin-bottom: 5px; color: var(--text); }
.cat-meta { font-size: 12px; color: var(--text3); margin-bottom: 8px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.cat-type { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 20px; }
.type-burn { background: var(--burn-dim); color: var(--burn); }
.type-strength { background: var(--strength-dim); color: var(--strength); }
.type-boxing { background: var(--boxing-dim); color: var(--boxing); }
.cat-seqs { display: flex; gap: 4px; flex-wrap: wrap; }
.cat-seq-tag { font-size: 10px; padding: 3px 8px; border-radius: 20px; background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }

.insight-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px; }
.insight-title { font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
.insight-val { font-family: var(--serif); font-size: 30px; color: var(--text); line-height: 1; margin-bottom: 3px; }
.insight-sub { font-size: 12px; color: var(--text3); }
.insight-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.insight-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text2); }
.insight-row:last-child { border-bottom: none; }
.insight-row-val { font-weight: 600; color: var(--text); }

.header-badge { font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: 20px; }

#toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 500; opacity: 0; transition: all .3s; pointer-events: none; white-space: nowrap; z-index: 100; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media print {
  #nav, #header, .action-row, .add-move-btn, .slot-rm { display: none !important; }
  body { background: white; color: black; }
  #content { overflow: visible; }
  .panel { display: block !important; padding: 0; }
  #panel-session { display: block !important; }
  .stats-bar, .coverage-row, #session-tips { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-top">
      <div>
        <div class="app-title">Studio Planner</div>
        <div class="app-subtitle">Hot room Pilates</div>
      </div>
      <div id="header-badge" class="header-badge">Mat burn</div>
    </div>
  </div>

  <div id="content">

    <!-- BUILD panel -->
    <div id="panel-build" class="panel active">
      <div class="class-tabs">
        <button class="class-tab active-burn" onclick="setClass('burn',this)">Mat burn</button>
        <button class="class-tab" onclick="setClass('strength',this)">Strength</button>
        <button class="class-tab" onclick="setClass('boxing',this)">Box strength</button>
      </div>
      <div class="sec-label">Sequences</div>
      <div id="seq-list"></div>
    </div>

    <!-- SESSION panel -->
    <div id="panel-session" class="panel">
      <input class="session-name-input" id="session-name" type="text" placeholder="Session name e.g. Tuesday Mat Burn" maxlength="60">
      <div class="stats-bar">
        <div class="stat-card"><div class="stat-val" id="stat-dur">0</div><div class="stat-lbl">Minutes</div></div>
        <div class="stat-card"><div class="stat-val" id="stat-moves">0</div><div class="stat-lbl">Moves</div></div>
        <div class="stat-card"><div class="stat-val" id="stat-seqs">0</div><div class="stat-lbl">Sequences</div></div>
      </div>
      <div class="sec-label">Sequence coverage</div>
      <div class="coverage-row" id="coverage-row"></div>
      <div class="sec-label">Moves</div>
      <div id="session-slots"></div>
      <div id="session-tips" style="margin-top:16px;"></div>
      <div class="action-row">
        <button class="btn-primary" onclick="saveSession()">Save to catalogue</button>
        <button class="btn-secondary" onclick="printSession()">Print</button>
        <button class="btn-secondary" onclick="clearSession()" style="padding:14px 12px;">Clear</button>
      </div>
    </div>

    <!-- LIBRARY panel -->
    <div id="panel-library" class="panel">
      <div class="add-move-form">
        <div class="form-title">Add a custom move</div>
        <div class="form-row full">
          <input class="form-input" id="fm-name" type="text" placeholder="Move name">
        </div>
        <div class="form-row">
          <select class="form-select" id="fm-class" onchange="populateSeqSel()">
            <option value="burn">Mat burn</option>
            <option value="strength">Pilates strength</option>
            <option value="boxing">Box strength</option>
          </select>
          <select class="form-select" id="fm-seq"></select>
        </div>
        <div class="form-row">
          <input class="form-input" id="fm-muscles" type="text" placeholder="Muscles (e.g. core, glutes)">
          <input class="form-input" id="fm-dur" type="number" placeholder="Mins" min="1" max="20">
        </div>
        <div class="form-row full">
          <select class="form-select" id="fm-intensity">
            <option value="low">Low intensity</option>
            <option value="medium" selected>Medium intensity</option>
            <option value="high">High intensity</option>
          </select>
        </div>
        <button class="form-btn" onclick="addCustomMove()">Add move to library</button>
      </div>
      <div class="class-tabs" style="margin-bottom:16px;">
        <button class="class-tab active-burn" onclick="setLibFilter('burn',this)">Mat burn</button>
        <button class="class-tab" onclick="setLibFilter('strength',this)">Strength</button>
        <button class="class-tab" onclick="setLibFilter('boxing',this)">Box strength</button>
      </div>
      <div id="lib-list"></div>
    </div>

    <!-- CATALOGUE panel -->
    <div id="panel-catalogue" class="panel">
      <div class="sec-label">Insights</div>
      <div id="insights-section"></div>
      <div class="sec-label" style="margin-top:4px;">Saved sessions</div>
      <div id="cat-list"></div>
    </div>

  </div>

  <nav id="nav">
    <button class="nav-btn active" onclick="showPanel('build',this)">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Build<div class="nav-active-bar"></div>
    </button>
    <button class="nav-btn" onclick="showPanel('session',this)">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
      Session<div class="nav-active-bar"></div>
    </button>
    <button class="nav-btn" onclick="showPanel('library',this)">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      Library<div class="nav-active-bar"></div>
    </button>
    <button class="nav-btn" onclick="showPanel('catalogue',this)">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Catalogue<div class="nav-active-bar"></div>
    </button>
  </nav>
</div>
<div id="toast"></div>

<script>
const CLASS_SEQS = {
  burn: [
    {id:"b-core",   key:"core",      label:"Core sequence",         color:"#4a9eff"},
    {id:"b-plank",  key:"plank",     label:"Plank sequence",        color:"#e85d3a"},
    {id:"b-four",   key:"fourpoint", label:"Four-point kneeling",   color:"#3dd68c"},
    {id:"b-side",   key:"sidelying", label:"Side lying",            color:"#c77dff"},
    {id:"b-stand",  key:"standing",  label:"Standing",              color:"#d4a843"},
    {id:"b-upper",  key:"upperbody", label:"Upper body",            color:"#ff6b9d"},
  ],
  strength: [
    {id:"s-corestr",key:"corestr",   label:"Core strength sequence",color:"#4a9eff"},
    {id:"s-hiit1",  key:"hiit1",     label:"HIIT sequence",         color:"#e85d3a"},
    {id:"s-lower",  key:"lower",     label:"Lower body strength",   color:"#3dd68c"},
    {id:"s-hiit2",  key:"hiit2",     label:"HIIT sequence 2",       color:"#d4a843"},
    {id:"s-upper",  key:"upper",     label:"Upper body strength",   color:"#c77dff"},
  ],
  boxing: [
    {id:"bx-core",  key:"bxcore",   label:"Core sequence",              color:"#4a9eff"},
    {id:"bx-box1",  key:"boxing1",  label:"Boxing sequence",            color:"#e85d3a"},
    {id:"bx-lower", key:"bxlower",  label:"Lower body strength",        color:"#3dd68c"},
    {id:"bx-box2",  key:"boxing2",  label:"Boxing sequence 2",          color:"#d4a843"},
    {id:"bx-upper", key:"bxupper",  label:"Upper body strength",        color:"#c77dff"},
    {id:"bx-full",  key:"fullbody", label:"Full body round",            color:"#ff6b9d"},
    {id:"bx-combo", key:"strbox",   label:"Strength/Boxing sequence",   color:"#3dd68c"},
  ],
};

const DEFAULT_MOVES = {
  burn:{
    "b-core":[
      {id:1001,name:"Hundred",duration:3,muscles:"Abdominals, core",intensity:"medium"},
      {id:1002,name:"Roll-up",duration:2,muscles:"Core, spine",intensity:"medium"},
      {id:1003,name:"Single leg stretch",duration:3,muscles:"Core, hip flexors",intensity:"medium"},
      {id:1004,name:"Double leg stretch",duration:3,muscles:"Core, shoulders",intensity:"high"},
      {id:1005,name:"Criss-cross",duration:3,muscles:"Obliques, core",intensity:"high"},
    ],
    "b-plank":[
      {id:1101,name:"Forearm plank hold",duration:2,muscles:"Core, shoulders",intensity:"medium"},
      {id:1102,name:"Plank shoulder taps",duration:3,muscles:"Core, arms",intensity:"high"},

let library = JSON.parse(localStorage.getItem("sp_lib_v1") || "null") || JSON.parse(JSON.stringify(DEFAULT_MOVES));
let catalogue = JSON.parse(localStorage.getItem("sp_cat_v1") || "[]");
let session = [];
let classFilter = "burn";
let libFilter = "burn";
let openSeqs = {};
let openLibSeqs = {};

function saveLib(){ localStorage.setItem("sp_lib_v1", JSON.stringify(library)); }
function saveCat(){ localStorage.setItem("sp_cat_v1", JSON.stringify(catalogue)); }

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }

function showPanel(name, btn){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("panel-"+name).classList.add("active");
  btn.classList.add("active");
  if(name==="catalogue") renderCatalogue();
  if(name==="library"){ populateSeqSel(); renderLibrary(); }
  if(name==="session") renderSession();
}

function classColor(ct){ return ct==="burn"?"var(--burn)":ct==="strength"?"var(--strength)":"var(--boxing)"; }
function classDim(ct){ return ct==="burn"?"var(--burn-dim)":ct==="strength"?"var(--strength-dim)":"var(--boxing-dim)"; }
function typeName(ct){ return ct==="burn"?"Mat burn":ct==="strength"?"Pilates strength":"Box strength"; }

function setClass(ct, btn){
  classFilter = ct;
  document.querySelectorAll("#panel-build .class-tab").forEach(b=>b.className="class-tab");
  btn.classList.add("active-"+ct);
  document.getElementById("header-badge").textContent = typeName(ct);
  document.getElementById("header-badge").style.background = classDim(ct);
  document.getElementById("header-badge").style.color = classColor(ct);
  document.getElementById("header-badge").style.border = "1.5px solid "+classColor(ct);
  openSeqs = {};
  renderSeqList();
}

function setLibFilter(ct, btn){
  libFilter = ct;
  document.querySelectorAll("#panel-library .class-tab").forEach(b=>b.className="class-tab");
  btn.classList.add("active-"+ct);
  openLibSeqs = {};
  renderLibrary();
}

function renderSeqList(){
  const seqs = CLASS_SEQS[classFilter];
  const el = document.getElementById("seq-list");
  el.innerHTML = seqs.map(seq=>{
    const moves = library[classFilter][seq.id]||[];
    const added = moves.filter(m=>session.find(s=>s.id===m.id)).length;
    const isOpen = openSeqs[seq.id];
    const pips = moves.map((_,i)=>`<div class="seq-pip" style="${i<added?"background:"+seq.color:""}"></div>`).join("");
    return `<div class="seq-block">
      <div class="seq-head" onclick="toggleSeq('${seq.id}')">
        <div class="seq-dot" style="background:${seq.color}"></div>
        <div style="flex:1;min-width:0;">
          <div class="seq-name">${seq.label}</div>
          <div class="seq-pips">${pips}</div>
        </div>
        <div class="seq-count">${added}/${moves.length}</div>
        <svg class="seq-chevron${isOpen?" open":""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="seq-body${isOpen?" open":""}">
        ${moves.length===0?`<div style="padding:16px;font-size:13px;color:var(--text3);">No moves yet — add some in the Library tab.</div>`:
          moves.map(m=>{
            const inSess = !!session.find(s=>s.id===m.id);
            return `<div class="move-row">
              <div class="move-info">
                <div class="move-name">${m.name}</div>
                <div class="move-muscle">${m.muscles}</div>
              </div>
              <div class="move-dur">${m.duration}m</div>
              <button class="add-move-btn${inSess?" added":""}" onclick="toggleMove(${m.id},'${seq.id}','${classFilter}')">${inSess?"Added":"+ Add"}</button>
            </div>`;
          }).join("")}
      </div>
    </div>`;
  }).join("");
}

function toggleSeq(id){ openSeqs[id]=!openSeqs[id]; renderSeqList(); }

function toggleMove(moveId, seqId, ct){
  const moves = library[ct][seqId]||[];
  const move = moves.find(m=>m.id===moveId);
  if(!move) return;
  const seq = CLASS_SEQS[ct].find(s=>s.id===seqId);
  const idx = session.findIndex(s=>s.id===moveId);
  if(idx>-1) session.splice(idx,1);
  else session.push({...move, seqId, seqLabel:seq.label, seqKey:seq.key, seqColor:seq.color, classType:ct});
  renderSeqList();
}

function renderSession(){
  const totalDur = session.reduce((a,m)=>a+m.duration,0);
  const seqKeys = new Set(session.map(m=>m.seqKey));
  document.getElementById("stat-dur").textContent = totalDur;
  document.getElementById("stat-moves").textContent = session.length;
  document.getElementById("stat-seqs").textContent = seqKeys.size;

  const seqs = CLASS_SEQS[classFilter];
  document.getElementById("coverage-row").innerHTML = seqs.map(s=>`<span class="cov-pill${seqKeys.has(s.key)?" covered":""}" style="${seqKeys.has(s.key)?"border-color:"+s.color+";color:"+s.color+"":""}">${s.label.replace(" sequence","").replace(" kneeling","").replace("Four-point","4pt").replace(" strength","")}</span>`).join("");

  const slotsEl = document.getElementById("session-slots");
  if(session.length===0){
    slotsEl.innerHTML=`<div class="empty-state"><svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><div class="empty-text">No moves yet</div><div class="empty-sub">Go to Build and add moves from the sequences</div></div>`;
  } else {
    const bySeq={};const seqOrder=[];
    session.forEach(m=>{ if(!bySeq[m.seqLabel]){bySeq[m.seqLabel]={color:m.seqColor,moves:[]};seqOrder.push(m.seqLabel);} bySeq[m.seqLabel].moves.push(m); });
    slotsEl.innerHTML=seqOrder.map(label=>{
      const {color,moves}=bySeq[label];
      return `<div class="session-group">
        <div class="session-group-label" style="color:${color}"><div class="session-group-dot" style="background:${color}"></div>${label}</div>
        ${moves.map(m=>`<div class="session-slot">
          <div class="slot-name">${m.name}</div>
          <div class="slot-dur">${m.duration}m</div>
          <button class="slot-rm" onclick="removeMove(${m.id})">×</button>
        </div>`).join("")}
      </div>`;
    }).join("");
  }
  renderTips();
}

function removeMove(id){
  session=session.filter(s=>s.id!==id);
  renderSession();
  renderSeqList();
}

function clearSession(){
  if(session.length===0) return;
  session=[];
  document.getElementById("session-name").value="";
  renderSession();
  renderSeqList();
  toast("Session cleared");
}

function renderTips(){
  const el=document.getElementById("session-tips");
  if(session.length<2){el.innerHTML="";return;}
  const tips=[];
  const seqs=CLASS_SEQS[classFilter];
  const coveredKeys=new Set(session.map(m=>m.seqKey));
  const missing=seqs.filter(s=>!coveredKeys.has(s.key));
  if(missing.length>0) tips.push({cls:"tip-warn",label:"Missing sequences",text:`No moves yet from: ${missing.map(s=>s.label).join(", ")}.`});
  const highs=session.filter(m=>m.intensity==="high").length;
  if(highs>session.length*0.75) tips.push({cls:"tip-info",label:"Intensity balance",text:"Heavy on high-intensity moves — consider a low-intensity recovery move."});
  if(coveredKeys.size>=seqs.length) tips.push({cls:"tip-ok",label:"Full coverage",text:"All sequences represented — great balanced session!"});
  if(tips.length===0) tips.push({cls:"tip-ok",label:"Looking good",text:"Good mix so far. Keep building!"});
  el.innerHTML=tips.map(t=>`<div class="tip-card ${t.cls}"><div class="tip-label">${t.label}</div><div class="tip-text">${t.text}</div></div>`).join("");
}

function saveSession(){
  const name=document.getElementById("session-name").value.trim()||"Untitled session";
  if(session.length===0){toast("Add some moves first!");return;}
  const seqGroups={};
  session.forEach(m=>{ if(!seqGroups[m.seqLabel])seqGroups[m.seqLabel]=[]; seqGroups[m.seqLabel].push(m); });
  catalogue.unshift({id:Date.now(),name,type:classFilter,date:new Date().toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"}),moves:[...session],seqGroups,duration:session.reduce((a,m)=>a+m.duration,0)});
  saveCat();
  toast("Session saved!");
}

function printSession(){
  const name=document.getElementById("session-name").value.trim()||"My Pilates Session";
  const seqGroups={};const seqOrder=[];
  session.forEach(m=>{ if(!seqGroups[m.seqLabel]){seqGroups[m.seqLabel]={color:m.seqColor,moves:[]};seqOrder.push(m.seqLabel);} seqGroups[m.seqLabel].moves.push(m); });
  const total=session.reduce((a,m)=>a+m.duration,0);
  const rows=seqOrder.map(label=>{
    const{color,moves}=seqGroups[label];
    return `<tr><td colspan="3" style="padding:10px 0 5px;font-weight:600;font-size:12px;color:${color};text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #eee;">${label}</td></tr>`+
    moves.map((m,i)=>`<tr><td style="padding:7px 0 7px 10px;border-bottom:1px solid #f0f0f0;font-size:13px;">${i+1}. ${m.name}</td><td style="padding:7px;border-bottom:1px solid #f0f0f0;font-size:12px;color:#777;">${m.muscles}</td><td style="padding:7px 0;border-bottom:1px solid #f0f0f0;font-size:12px;color:#777;text-align:right;">${m.duration} min</td></tr>`).join("");
  }).join("");
  const w=window.open("","_blank");
  w.document.write(`<!DOCTYPE html><html><head><title>${name}</title>
  <style>body{font-family:-apple-system,sans-serif;max-width:680px;margin:40px auto;color:#111;padding:0 20px;}
  h1{font-size:24px;margin-bottom:4px;}
  .meta{color:#888;font-size:13px;margin-bottom:28px;}
  table{width:100%;border-collapse:collapse;}
  .footer{margin-top:24px;padding-top:14px;border-top:2px solid #eee;font-size:12px;color:#aaa;}
  @media print{@page{margin:1.5cm}}</style></head><body>
  <h1>${name}</h1>
  <div class="meta">${typeName(classFilter)} &nbsp;·&nbsp; ${session.length} moves &nbsp;·&nbsp; ${total} minutes total &nbsp;·&nbsp; ${new Date().toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"})}</div>
  <table>${rows}</table>
  <div class="footer">Studio Planner &nbsp;·&nbsp; Total: ${total} minutes &nbsp;·&nbsp; ${seqOrder.length} sequences</div>
  <script>window.onload=()=>window.print();<\/script></body></html>`);
  w.document.close();
}

function renderLibrary(){
  const seqs=CLASS_SEQS[libFilter];
  const el=document.getElementById("lib-list");
  el.innerHTML=seqs.map(seq=>{
    const moves=library[libFilter][seq.id]||[];
    const isOpen=openLibSeqs[seq.id];
    return `<div class="seq-block">
      <div class="seq-head" onclick="toggleLibSeq('${seq.id}')">
        <div class="seq-dot" style="background:${seq.color}"></div>
        <div class="seq-name" style="flex:1;">${seq.label}</div>
        <div class="seq-count">${moves.length} moves</div>
        <svg class="seq-chevron${isOpen?" open":""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="seq-body${isOpen?" open":""}">
        ${moves.map(m=>`<div class="move-row">
          <div class="move-info"><div class="move-name">${m.name}</div><div class="move-muscle">${m.muscles} · ${m.intensity}</div></div>
          <div class="move-dur">${m.duration}m</div>
        </div>`).join("")}
        ${moves.length===0?`<div style="padding:14px 16px;font-size:13px;color:var(--text3);">No moves yet.</div>`:""}
      </div>
    </div>`;
  }).join("");
}

function toggleLibSeq(id){ openLibSeqs[id]=!openLibSeqs[id]; renderLibrary(); }

function populateSeqSel(){
  const ct=document.getElementById("fm-class").value||libFilter;
  const sel=document.getElementById("fm-seq");
  sel.innerHTML=CLASS_SEQS[ct].map(s=>`<option value="${s.id}">${s.label}</option>`).join("");
}

function addCustomMove(){
  const name=document.getElementById("fm-name").value.trim();
  const ct=document.getElementById("fm-class").value;
  const seqId=document.getElementById("fm-seq").value;
  const muscles=document.getElementById("fm-muscles").value.trim()||"General";
  const dur=parseInt(document.getElementById("fm-dur").value)||3;
  const intensity=document.getElementById("fm-intensity").value;
  if(!name){toast("Please enter a move name");return;}
  if(!library[ct][seqId])library[ct][seqId]=[];
  library[ct][seqId].push({id:Date.now(),name,duration:dur,muscles,intensity});
  saveLib();
  document.getElementById("fm-name").value="";
  document.getElementById("fm-muscles").value="";
  document.getElementById("fm-dur").value="";
  renderLibrary();
  toast(`"${name}" added!`);
}

function renderCatalogue(){
  const ip=document.getElementById("insights-section");
  const cl=document.getElementById("cat-list");
  if(catalogue.length===0){
    ip.innerHTML="";
    cl.innerHTML=`<div class="empty-state"><div class="empty-text" style="color:var(--text3);">No sessions saved yet</div><div class="empty-sub" style="margin-top:6px;">Build a session and save it to start your catalogue</div></div>`;
    return;
  }
  const mc={},tc={};
  catalogue.forEach(s=>{ tc[s.type]=(tc[s.type]||0)+1; s.moves.forEach(m=>mc[m.name]=(mc[m.name]||0)+1); });
  const topMoves=Object.entries(mc).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const totalMin=catalogue.reduce((a,s)=>a+s.duration,0);
  ip.innerHTML=`
    <div class="insight-grid">
      <div class="insight-card"><div class="insight-val">${catalogue.length}</div><div class="insight-sub">Sessions saved</div></div>
      <div class="insight-card"><div class="insight-val">${totalMin}</div><div class="insight-sub">Total minutes</div></div>
    </div>
    <div class="insight-card" style="margin-bottom:8px;">
      <div class="insight-title">Class breakdown</div>
      ${Object.entries(tc).map(([t,c])=>`<div class="insight-row"><span>${typeName(t)}</span><span class="insight-row-val">${c} session${c>1?"s":""}</span></div>`).join("")}
    </div>
    ${topMoves.length>0?`<div class="insight-card" style="margin-bottom:16px;"><div class="insight-title">Most used moves</div>${topMoves.map(([n,c])=>`<div class="insight-row"><span>${n}</span><span class="insight-row-val">×${c}</span></div>`).join("")}</div>`:""}
  `;
  cl.innerHTML=catalogue.map(s=>`<div class="cat-item">
    <div class="cat-title">${s.name}</div>
    <div class="cat-meta">
      <span class="cat-type type-${s.type}">${typeName(s.type)}</span>
      <span>${s.moves.length} moves</span>
      <span>${s.duration} min</span>
      <span>${s.date}</span>
    </div>
    <div class="cat-seqs">${Object.keys(s.seqGroups||{}).map(l=>`<span class="cat-seq-tag">${l}</span>`).join("")}</div>
  </div>`).join("");
}

populateSeqSel();
document.getElementById("fm-class").addEventListener("change", populateSeqSel);
renderSeqList();
</script>
</body>
</html>
